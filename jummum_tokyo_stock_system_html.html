const UNIT_OPTIONS_BY_ITEM = {
  "แป้งทอดกรอบ UFM": ["กรัม","กิโลกรัม"],
  "แป้งสาลีตราเชอรี่": ["กรัม","กิโลกรัม"],
  "แป้งข้าวเจ้า": ["กรัม","กิโลกรัม"],
  "แป้งข้าวโพด": ["กรัม","กิโลกรัม"],
  "น้ำตาลทรายมิตรผล": ["กรัม","กิโลกรัม"],
  "แป้งหอม": ["กรัม","กิโลกรัม"],
  "ผงฟู": ["กรัม","กิโลกรัม"],
  "เบคกิ้งโซดา": ["กรัม","กิโลกรัม"],
  "เกลือ": ["กรัม","กิโลกรัม"]
};

let currentCategory = "วัตถุดิบแป้งครีม";

function getCategoryStyle(category) {
  return {
    "วัตถุดิบแป้งครีม": {
      color: "bg-yellow-500",
      icon: "🧈"
    },
    "วัตถุดิบคาว": {
      color: "bg-red-500",
      icon: "🌭"
    },
    "วัตถุดิบหวาน": {
      color: "bg-pink-500",
      icon: "🍫"
    },
    "ซอส": {
      color: "bg-orange-500",
      icon: "🥫"
    },
    "บรรจุภัณฑ์": {
      color: "bg-cyan-500",
      icon: "📦"
    },
    "ของสิ้นเปลือง": {
      color: "bg-gray-500",
      icon: "🔥"
    }
  }[category];
}

function normalizeQtyToBase_(qty, unitSelected, unitOptions) {
  const n = Number(qty);

  if (!isFinite(n)) {
    return {
      qty: NaN,
      unit: String(unitSelected || "").trim()
    };
  }

  const u = String(unitSelected || "").trim();
  const opts = (unitOptions || []).map(v => String(v || "").trim());

  if (opts.includes("กรัม") && opts.includes("กิโลกรัม")) {
    return {
      qty: u === "กรัม" ? n / 1000 : n,
      unit: "กิโลกรัม"
    };
  }

  return {
    qty: n,
    unit: u
  };
}

function buildCategories(){
  const grid=document.getElementById('category-grid');
  grid.innerHTML='';

  Object.keys(stockItems).forEach(cat=>{
    const style=getCategoryStyle(cat);

    grid.innerHTML+=`
    <button onclick="selectCategory('${cat}')" class="card ${style.color} text-white rounded-2xl p-5 text-left shadow-lg">
      <div class="text-4xl mb-2">${style.icon}</div>
      <div class="font-bold text-lg">${cat}</div>
      <div class="text-sm opacity-90">${stockItems[cat].length} รายการ</div>
    </button>`;
  });
}

function selectCategory(cat){
  currentCategory=cat;
  document.getElementById('current-category').innerText=cat;
  renderTable();
}

function renderTable(){
  const body=document.getElementById('stock-body');
  body.innerHTML='';

  stockItems[currentCategory].forEach(item=>{
    const options=UNIT_OPTIONS_BY_ITEM[item.name]||[item.unit];

    body.innerHTML+=`
    <tr class="border-b">
      <td class="p-3">${item.name}</td>
      <td class="p-3">
        <input type="number" step="0.001" class="qty border rounded-lg px-3 py-2 w-full" data-name="${item.name}">
      </td>
      <td class="p-3">
        <select class="unit border rounded-lg px-2 py-2" data-name="${item.name}">
          ${options.map(u=>`<option>${u}</option>`).join('')}
        </select>
      </td>
      <td class="p-3">
        <input type="text" class="note border rounded-lg px-3 py-2 w-full" data-name="${item.name}">
      </td>
    </tr>`;
  });
}

function saveData(){
  const checker=document.getElementById('checker-name').value;

  const data=[];

  document.querySelectorAll('.qty').forEach(q=>{
    const name=q.dataset.name;
    const unit=document.querySelector(`.unit[data-name="${name}"]`).value;
    const note=document.querySelector(`.note[data-name="${name}"]`).value;

    const options=UNIT_OPTIONS_BY_ITEM[name]||[unit];
    const normalized=normalizeQtyToBase_(q.value,unit,options);

    data.push({
      name,
      quantity:normalized.qty,
      unit:normalized.unit,
      note
    });
  });

  const history=JSON.parse(localStorage.getItem('tokyo_history')||'[]');

  history.unshift({
    date:new Date().toLocaleString('th-TH'),
    category:currentCategory,
    checker,
    items:data
  });

  localStorage.setItem('tokyo_history',JSON.stringify(history));

  alert('บันทึกข้อมูลสำเร็จ');
}

function showHistory(){
  const section=document.getElementById('history-section');
  section.classList.remove('hidden');

  const list=document.getElementById('history-list');
  const history=JSON.parse(localStorage.getItem('tokyo_history')||'[]');

  list.innerHTML='';

  history.forEach(h=>{
    list.innerHTML+=`
    <div class="border rounded-xl p-4 mb-4">
      <div class="font-bold text-lg">${h.category}</div>
      <div class="text-sm text-gray-500">${h.date} | ${h.checker||'-'}</div>
      <div class="mt-3 space-y-1">
        ${h.items.map(i=>`
          <div class="flex justify-between text-sm">
            <span>${i.name}</span>
            <span>${i.quantity} ${i.unit}</span>
          </div>`).join('')}
      </div>
    </div>`;
  });
}

buildCategories();
renderTable();
</script>
